    function make(tag, attrs = {}) { const el = document.createElementNS(ns, tag); Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value)); return el; }
    function wrap(value, width) { const output = []; let line = ''; for (const char of Array.from(value)) { if (char === '｜') { if (line) output.push(line); line = ''; continue; } if (line.length >= width) { output.push(line); line = ''; } line += char; } if (line) output.push(line); return output; }

        });
        byId.get('root').x = 48; byId.get('root').y = 250;
        return result;
      }
      app.items.forEach(([l1, l2, l3, tab]) => {
        const level1 = `l1:${l1}`; const level2 = `${level1}|l2:${l2}`; const level3 = `${level2}|l3:${l3}`;
        if (!byId.has(level1)) add(node(level1, 'l1', l1, '', 'root'));
        if (!byId.has(level2)) add(node(level2, 'l2', l2, '', level1));
        if (!byId.has(level3)) add(node(level3, 'l3', l3, `Tab：${tab}`, level2));
      });

      const leaves = result.filter(item => item.children.length === 0); let cursor = 68;
      leaves.forEach(item => { item.y = cursor; cursor += item.height + 30; });
      const placeParents = item => { if (!item.children.length) return item.y; item.children.forEach(placeParents); item.y = item.children.reduce((sum, child) => sum + child.y + child.height / 2, 0) / item.children.length - item.height / 2; return item.y; };
      placeParents(byId.get('root'));

    function home() { selected = null; draw(); if (current.id === 'P1' && p1Mode === 'index') fit(); else centerOn(nodes.find(item => item.id === 'root'), current.id === 'P1' ? .55 : .78); }

    }
