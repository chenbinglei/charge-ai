spring:
  application:
    name: api-gateway
  main:
    banner-mode: "off"
server:
  port: ${EVCO_API_GATEWAY_SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
