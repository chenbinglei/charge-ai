# 平台服务配置；W2 起承载 IAM/认证/授权业务，环境专有值全部走环境变量。
spring:
  application:
    name: platform-service
  main:
    banner-mode: "off"
  # 数据源指向 evco_iam 事实库；连接串与凭据不落仓库，默认值仅供本地 Compose。
  datasource:
    url: jdbc:mysql://${EVCO_MYSQL_HOST:localhost}:${EVCO_MYSQL_PORT:3306}/${EVCO_MYSQL_DATABASE:evco_iam}?connectionTimeZone=UTC&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${EVCO_MYSQL_USERNAME:root}
    password: ${EVCO_MYSQL_PASSWORD:replace-with-local-only-password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  # 前向迁移：迁移脚本归 database/mysql/evco_iam/migration 统一管理，仅前向执行。
  flyway:
    enabled: true
    locations: filesystem:${EVCO_MIGRATION_BASE:../../../database/mysql}/evco_iam/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  # Redis：图形验证码、SSO ticket 与权限列表缓存；连接惰性建立，不可用时不影响启动。
  data:
    redis:
      host: ${EVCO_REDIS_HOST:localhost}
      port: ${EVCO_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
# 服务监听端口可由环境变量覆盖，仓库不保存环境专有配置。
server:
  port: ${EVCO_PLATFORM_SERVER_PORT:8081}
  shutdown: graceful
# 管理端点仅暴露健康和信息，禁止暴露业务或敏感配置。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false
# MyBatis-Plus：下划线转驼峰、关闭 banners；逻辑删除与乐观锁由应用层显式处理。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: "off"
    db-config:
      id-type: assign_id
# 平台服务 Web 安全配置（evco-starter）：管理端鉴权开关与免认证端点白名单。
evco:
  web:
    security:
      # 免认证精确端点；登出与刷新凭请求体 refresh_token 自认证，access_token 过期时仍须可用。
      anonymous-endpoints:
        - "GET /api/v1/auth/captcha"
        - "POST /api/v1/auth/login"
        - "POST /api/v1/auth/sso/login"
        - "POST /api/v1/auth/sso/tickets"
        - "POST /api/v1/auth/logout"
        - "POST /api/v1/auth/refresh"
# 平台业务配置。
app:
  # 运行环境标识；用于 Redis 键前缀 evco:{env}:{domain}:{entity}:{id} 隔离。
  env: ${EVCO_ENV:local}
  # 部署模式（设计包 §8.1）：部署时由 platform_setting 种子初始化后注入配置中心，运行期只读。
  deployment-mode: ${EVCO_DEPLOYMENT_MODE:STANDALONE}
  auth:
    # JWT 签名密钥：生产必须由环境变量注入 ≥32 字节随机值，仓库不保存真实密钥。
    jwt-secret: ${EVCO_AUTH_JWT_SECRET:replace-with-local-only-jwt-secret-32bytes}
    # access_token 有效期（分钟），与 auth_session.expires_at TTL 对齐。
    access-token-ttl-minutes: 30
    # refresh_token 有效期（天），一次性使用。
    refresh-token-ttl-days: 14
    # 图形验证码：4-6 位字母数字，Redis 120 秒一次性校验。
    captcha:
      length: 5
      ttl-seconds: 120
    # 登录失败锁定：连续 5 次失败锁 30 分钟（iam_user.locked_until/fail_window_start）。
    lockout:
      max-fails: 5
      lock-minutes: 30
    # SSO 服务间凭证（X-API-Key）：IOT 推送 ticket 必须携带；空值时 IOT 模式下 fail-closed。
    sso:
      api-key: ${EVCO_AUTH_SSO_API_KEY:}
