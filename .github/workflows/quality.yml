name: W1 工程质量门禁

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**
      - feat/**
      - fix/**
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: 后端质量与 SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 安装 Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 执行 Maven Wrapper 质量门禁
        run: ./mvnw -f ev-charging-operations/backend/pom.xml --batch-mode verify
      - name: 归档后端 SBOM 与覆盖率报告
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-quality-evidence
          if-no-files-found: error
          path: |
            ev-charging-operations/backend/target/backend-sbom.json
            ev-charging-operations/backend/**/target/site/jacoco/**

  frontend-quality:
    name: 前端七端构建与 SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 安装 Node 22 基线
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ev-charging-operations/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: ev-charging-operations/frontend/pnpm-lock.yaml
      - name: 安装锁定依赖
        working-directory: ev-charging-operations/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 执行类型、测试、构建和跨端边界检查
        working-directory: ev-charging-operations/frontend
        run: pnpm run verify
      - name: 生成前端 SBOM
        working-directory: ev-charging-operations/frontend
        run: pnpm run sbom
      - name: 归档前端 SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-sbom
          if-no-files-found: error
          path: ev-charging-operations/frontend/artifacts/frontend-sbom.json

  foundation-quality:
    name: 契约、迁移和 Compose 校验
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 安装 Node 22 基线
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ev-charging-operations/frontend/.nvmrc
      - name: 校验基础工程资产
        run: |
          bash ev-charging-operations/scripts/quality/check-foundation.sh
          docker compose -f ev-charging-operations/platform/compose.yaml config --quiet
          git diff --check

  dependency-review:
    name: 依赖变更漏洞审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: 审查新增依赖
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          config-file: .github/dependency-review-config.yml

  code-scanning:
    name: SAST（CodeQL）
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 初始化 CodeQL
        uses: github/codeql-action/init@67ba681cdcbc95ed0371c210ccf82c4d968ae5eb
        with:
          languages: java-kotlin,javascript-typescript
      - name: 安装 Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 构建 Java 分析目标
        run: ./mvnw -f ev-charging-operations/backend/pom.xml --batch-mode -DskipTests package
      - name: 分析代码
        uses: github/codeql-action/analyze@67ba681cdcbc95ed0371c210ccf82c4d968ae5eb

  container-image-scan:
    name: 容器镜像漏洞扫描
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
          - redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
          - apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
          - emqx/emqx:5.8.2@sha256:76bc406d14107aa73539178f536c05e4df2f1f54388bbbbc9d846599a51317f9
          - clickhouse/clickhouse-server:24.12.3.47@sha256:3fb2bd1a2fa9e095a1844b2b559eb580795773cf459a994f53be86e7ec999704
          - minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144
          - otel/opentelemetry-collector-contrib:0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197
          - prom/prometheus:v3.0.1@sha256:565ee86501224ebbb98fc10b332fa54440b100469924003359edf49cbce374bd
          - grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    steps:
      - name: 扫描固定镜像
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ matrix.image }}
          exit-code: "1"
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  sensitive-information-scan:
    name: 明文凭据扫描
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 执行高置信度敏感扫描
        run: bash ev-charging-operations/scripts/quality/check-sensitive-files.sh
